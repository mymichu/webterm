# Workspaces the gateway offers, in the order the side panel lists them; the
# first is opened when the URL doesn't name one. With a single workspace the
# page shows only the terminal, without the header.
#
# Each workspace either relays to a term-server (`url`, a workspace service in
# compose.yaml: ws://<service>:8080/ws) or runs a `command` in the gateway
# itself (which is distroless, so only for custom gateway images):
#
#   - name: shell
#     command: [/bin/sh, -l]
#
# Restart the gateway after editing this file (`docker compose restart gateway`).

workspaces:
  - name: go
    description: Go · golang:1-trixie
    url: ws://go:8080/ws

  - name: python
    description: Python · python:3-trixie
    url: ws://python:8080/ws
