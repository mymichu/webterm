# Workspaces the browser terminal can attach to, in the order the side panel
# lists them; the first is opened when the URL doesn't name one. With a single
# workspace the page shows only the terminal, without the header.
#
# Each workspace either attaches to a tmux server (`tmux_socket`, and
# optionally `tmux_session`, default "main") or runs a `command`:
#
#   - name: shell
#     command: [/bin/sh, -l]
#
# A tmux workspace must match a service in compose.yaml: its socket is
# /run/tmux/<WORKSPACE_NAME>. Restart the sidecar after editing this file
# (`docker compose restart terminal`).

workspaces:
  - name: go
    description: Go · golang:1-trixie
    tmux_socket: /run/tmux/go

  - name: python
    description: Python · python:3-trixie
    tmux_socket: /run/tmux/python
