# tmux config for the workspace's tmux server (prefix: C-b).
set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10          # don't delay <Esc> in nvim
set -g focus-events on          # lets nvim's autoread fire on focus
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

bind r source-file /opt/devtools/etc/tmux.conf \; display "tmux.conf reloaded"

# Splits and new windows keep the current directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane navigation (prefix-based, so nvim keeps C-hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g status-style "bg=default,fg=#787c99"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#7aa2f7]%H:%M "
setw -g window-status-current-style "fg=#7aa2f7,bold"
set -g pane-border-style "fg=#5a6a92"
set -g pane-active-border-style "fg=#9ecbff"

# Session persistence: resurrect + continuum. The options must be set before
# the plugins load, and continuum last so its autosave hook survives.
# prefix C-s saves, prefix C-r restores.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
run-shell /opt/devtools/tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell /opt/devtools/tmux-plugins/tmux-continuum/continuum.tmux
