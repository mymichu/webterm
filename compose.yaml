# Browser terminal for containerized dev environments.
#
#   go, python  Workspaces: a language base image plus the shared devtools
#               layer (term-server, tmux, fish, LazyVim, git, ...; see
#               docker/Dockerfile). Each serves its own terminal on :8080,
#               reachable only on the compose network unless you publish it.
#   gateway     One URL for all of them: serves the page and relays each
#               browser tab to the workspace picked in the header.
#               docker/webterm.yaml lists the workspaces.
#
#   just up   →   http://localhost:8080
#
# To add a workspace, copy a service below and change its name, WORKSPACE_BASE
# (an apt-based image, e.g. rust:1-trixie or node:24-trixie) and volume, then
# add it to docker/webterm.yaml.
name: webterm

x-workspace: &workspace
  init: true
  restart: unless-stopped
  environment:
    # 1: tabs attach to a persistent tmux session; 0: a plain fish shell per tab.
    WORKSPACE_TMUX: ${WORKSPACE_TMUX:-1}
    # Shared secret between the gateway and the workspaces (optional).
    TERM_TOKEN: ${WORKSPACE_TOKEN:-}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
    interval: 5s
    # The first start installs LazyVim plugins before the terminal comes up.
    start_period: 15m

services:
  go:
    <<: *workspace
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: workspace
      args:
        WORKSPACE_BASE: golang:1-trixie
    hostname: go
    volumes:
      - home-go:/home/dev
      - ${WORKSPACE_DIR:-./workspace}:/home/dev/workspace
    # Uncomment to also open this workspace directly, without the gateway:
    # ports:
    #   - "127.0.0.1:8081:8080"

  python:
    <<: *workspace
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: workspace
      args:
        WORKSPACE_BASE: python:3-trixie
    hostname: python
    volumes:
      - home-python:/home/dev
      - ${WORKSPACE_DIR:-./workspace}:/home/dev/workspace

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gateway
    restart: unless-stopped
    ports:
      # Localhost only: a connection is a shell in a workspace.
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - ./docker/webterm.yaml:/etc/webterm/webterm.yaml:ro
    environment:
      # Set to require http://localhost:8080/?token=...
      TERM_TOKEN: ${TERM_TOKEN:-}
      TERM_UPSTREAM_TOKEN: ${WORKSPACE_TOKEN:-}

volumes:
  # One home per workspace: plugins, Mason tools, shell history and
  # tmux-resurrect saves persist across restarts.
  home-go:
  home-python:
