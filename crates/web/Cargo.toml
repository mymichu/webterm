[package]
name = "web"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
protocol = { path = "../protocol" }
term-core = { path = "../term-core" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlTextAreaElement",
  "CssStyleDeclaration", "DomRect", "Navigator", "Clipboard", "Location",
  "CanvasRenderingContext2d", "TextMetrics", "ImageData",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer", "WebGlTexture",
  "WebGlUniformLocation", "WebGlVertexArrayObject",
  "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "EventTarget",
  "KeyboardEvent", "MouseEvent", "WheelEvent", "InputEvent", "CompositionEvent",
  "ClipboardEvent", "DataTransfer", "FocusEvent",
  "ResizeObserver", "ResizeObserverEntry", "AddEventListenerOptions",
]
